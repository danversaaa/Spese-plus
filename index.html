<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Spese+">
  <link rel="manifest" href="./manifest.webmanifest?v=1.0.1">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=1.0.1">
  <title>Spese+ • Bilancio personale</title>
</head>
<body>
<div id="authView" class="auth-shell">
  <div class="auth-card">
    <div class="logo">Spese<span>+</span></div>
    <p>Le tue spese di casa, salvate online e sincronizzate.</p>
    <div class="tabs">
      <button id="tabLogin" class="active">Accedi</button>
      
    </div>
    <form id="authForm">
      <label>Email<input id="email" type="email" required autocomplete="email"></label>
      <label>Password<input id="password" type="password" minlength="6" required autocomplete="current-password"></label>
      <button id="authSubmit" class="primary" type="submit">Accedi</button>
    </form>
    <div id="authMsg" class="msg"></div>
    <div class="privacy-note">Accesso riservato all’utente autorizzato. Nessuna registrazione pubblica.</div><div class="build-badge">Spese+ 1.0.1</div>
  </div>
</div>

<div id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="brand">Spese<span>+</span><small>Bilancio personale</small></div>
    <nav>
      <button data-page="dashboard" class="active"><span class="nav-icon">⌂</span><span>Home</span></button>
      <button data-page="spese"><span class="nav-icon">▤</span><span>Spese</span></button>
      <button data-page="entrate"><span class="nav-icon">€</span><span>Entrate</span></button>
      <button data-page="bollette"><span class="nav-icon">⚡</span><span>Bollette</span></button>
      <button class="mobile-only" data-page="altro"><span class="nav-icon">•••</span><span>Altro</span></button>
      <button class="desktop-only" data-page="statistiche"><span class="nav-icon">▥</span><span>Statistiche</span></button>
      <button class="desktop-only" data-page="impostazioni"><span class="nav-icon">⚙</span><span>Impostazioni</span></button>
    </nav>
  </aside>
  <main>
    <header class="top">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div id="syncStatus" class="muted">Sincronizzazione…</div>
      </div>
      <div class="top-actions">
        <select id="yearSelect"></select>
        <button id="logoutBtn" class="ghost">Esci</button>
      </div>
    </header>
    <section id="page"></section>
  </main>
</div>

<div id="modal" class="modal-back hidden"></div>

<script>
  window.CASA_APP_READY = false;

  // Blocca il normale invio HTML anche se il modulo principale non parte.
  document.getElementById("authForm").addEventListener("submit", function(e){
    e.preventDefault();
    if (!window.CASA_APP_READY) {
      const m=document.getElementById("authMsg");
      if(!m.textContent || m.textContent.includes("non ha ancora caricato")) {
        m.textContent="Spese+ non ha ancora caricato il motore dell’app. Attendi un istante oppure ricarica la pagina.";
      }
    }
  }, true);

  // I due tab devono almeno reagire anche se il modulo Firebase fallisce.
  document.getElementById("tabLogin").addEventListener("click", function(e){
    e.preventDefault();
  });

  window.addEventListener("error", function(e){
    const msg = document.getElementById("authMsg");
    if (msg && !window.CASA_APP_READY) {
      msg.textContent = "Errore di caricamento: " + (e.message || "JavaScript non disponibile");
    }
  });
  window.addEventListener("unhandledrejection", function(e){
    const msg = document.getElementById("authMsg");
    if (msg && !window.CASA_APP_READY) {
      const reason = e.reason && (e.reason.message || e.reason.code) ? (e.reason.message || e.reason.code) : String(e.reason || "errore sconosciuto");
      msg.textContent = "Errore di caricamento app: " + reason;
    }
  });
</script>
<script type="module">
  import("./app.js?v=1.0.1")
    .then(() => {
      window.CASA_APP_READY = true;
      const msg = document.getElementById("authMsg");
      if (msg && msg.textContent.includes("non ha ancora caricato")) msg.textContent = "";
    })
    .catch(err => {
      console.error("Spese+ boot error", err);
      const msg = document.getElementById("authMsg");
      if (msg) msg.textContent = "Spese+ non riesce a caricare l’app: " + (err.message || err);
    });
</script>
</body>
</html>
